name: benim-depom-front

services:
  web:
    image: ghcr.io/automatonsoft/benim-depom-front:${IMAGE_TAG:?Set IMAGE_TAG in .deploy.env}
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    ports:
      - "127.0.0.1:${APP_BIND_PORT:-18083}:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"