name: CI

on:
  pull_request:
    branches:
      - local
      - stage
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch-flow:
    name: Validate branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate allowed Pull Request direction
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == "local" && "$HEAD_BRANCH" != feature/* ]]; then
            echo "Only Pull Requests feature/* -> local are allowed."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "stage" && "$HEAD_BRANCH" != "local" && "$HEAD_BRANCH" != feature/* && "$HEAD_BRANCH" != hotfix/* ]]; then
            echo "Only Pull Requests feature/*, local or hotfix/* -> stage are allowed."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "stage" && "$HEAD_BRANCH" != hotfix/* ]]; then
            echo "Only Pull Requests stage or hotfix/* -> main are allowed."
            exit 1
          fi

  test-and-lint:
    name: Test and lint
    needs: validate-branch-flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  build-production-image:
    name: Build production image
    needs: test-and-lint
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag benim-depom-front-ci:${{ github.sha }} .
