name: Build and deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/automatonsoft/benim-depom-front
  DEPLOY_DIR: /home/alikhan/apps/benim-depom-front
  PROJECT_NAME: benim-depom-front
  APP_BIND_PORT: 18083

jobs:
  build-and-push:
    name: Build and publish production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://benim.automatonsoft.de

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Upload deployment configuration
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR'"
          scp -p docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.prod.yml"

      - name: Deploy production
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE_TAG='$IMAGE_TAG' DEPLOY_DIR='$DEPLOY_DIR' PROJECT_NAME='$PROJECT_NAME' APP_BIND_PORT='$APP_BIND_PORT' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_DIR"

          printf 'IMAGE_TAG=%s\nAPP_BIND_PORT=%s\n' "$IMAGE_TAG" "$APP_BIND_PORT" > .deploy.env.tmp
          mv .deploy.env.tmp .deploy.env
          chmod 600 .deploy.env

          docker compose \
            --project-name "$PROJECT_NAME" \
            --env-file .deploy.env \
            -f docker-compose.prod.yml \
            pull

          docker compose \
            --project-name "$PROJECT_NAME" \
            --env-file .deploy.env \
            -f docker-compose.prod.yml \
            up -d --force-recreate --wait --wait-timeout 120 web

          curl --fail --silent --show-error \
            "http://127.0.0.1:${APP_BIND_PORT}/"

          docker compose \
            --project-name "$PROJECT_NAME" \
            --env-file .deploy.env \
            -f docker-compose.prod.yml \
            ps
          REMOTE